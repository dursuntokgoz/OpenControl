name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test-build:
    name: Lint & Unit Tests & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Dependencies
        run: make deps
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Build
        run: make build
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  integration-e2e-smoke:
    name: Integration / E2E / Smoke (Docker)
    runs-on: ubuntu-latest
    needs: lint-test-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Dependencies
        run: |
          make vendor-go
          make e2e-deps
      - name: Integration tests
        run: make itest
      - name: Tear down integration env
        if: always()
        run: make down
      - name: E2E
        run: make e2e
      - name: Smoke (clean container install)
        run: make smoke
